name: Refresh Marvel Church data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. 10:17 UTC is ~6:17 AM EDT / 5:17 AM EST.
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-marvel-church-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install refresh dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Refresh Marvel Church data
        run: python tools/refresh_data.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Refresh Marvel Church planner data"
          git push
